name: Generate Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Skip if commit is from this workflow (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for changelog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate backend changelog
        run: npm run changelog
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate frontend changelog
        run: npm run changelog
        working-directory: frontend

      - name: Commit changelog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/CHANGELOG.md frontend/CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update changelogs [skip ci]"
          git push
